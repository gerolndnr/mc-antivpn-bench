name: benchmark

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly detection chunks for the proxycheck_key profile: one chunk per UTC day keeps all
    # products' ProxyCheck lookups under one free key's daily quota (see METHODOLOGY 7.1).
    - cron: '20 0 * * *'
  workflow_dispatch:
    inputs:
      family:
        description: Test family
        type: choice
        options: [functional, detection, failure, redis, performance, all, providers]
        default: functional
      products:
        description: Comma-separated product ids (empty = all)
        default: ''
      platforms:
        description: Comma-separated platforms (empty = all)
        default: ''
      detection_limit:
        description: Limit detection subjects (0 = full dataset)
        default: '0'
      detection_chunk:
        description: Detection chunk k/n (empty = all subjects)
        default: ''
      detection_profiles:
        description: Detection profiles (comma-separated)
        default: 'enforce'
      perf_profiles:
        description: Performance profiles (comma-separated)
        default: 'enforce'
      perf_rounds:
        description: Performance rounds (3 for a published result, 1 for a quick check)
        default: '3'
      services:
        description: providers family only, comma-separated service ids (empty = all)
        default: ''
      state_from_run:
        description: Workflow run id whose recorded provider answers to reuse (empty = start fresh)
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography==43.0.3 pyyaml==6.0.2 h2==4.1.0
      - run: PYTHONPATH=harness python -m unittest discover -s tests -v

  bench:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      RUN_ID: ${{ github.run_id }}-${{ inputs.family || 'detection' }}
    steps:
      - uses: actions/checkout@v4
      - name: Nightly chunk
        id: nightly
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            k=$(( ( $(date -u +%s) - $(date -u -d 2026-10-07 +%s) ) / 86400 ))
            if [ "$k" -lt 0 ] || [ "$k" -gt 3 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "family=detection" >> "$GITHUB_OUTPUT"
            echo "chunk=$k/4" >> "$GITHUB_OUTPUT"
            echo "profiles=proxycheck_key" >> "$GITHUB_OUTPUT"
          else
            echo "family=${{ inputs.family }}" >> "$GITHUB_OUTPUT"
            echo "chunk=${{ inputs.detection_chunk }}" >> "$GITHUB_OUTPUT"
            echo "profiles=${{ inputs.detection_profiles }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Host description
        run: |
          echo "BENCH_HOST_DESCRIPTION=GitHub-hosted $(nproc) vCPU, $(free -g | awk '/Mem/{print $2}') GB, $(lscpu | sed -n 's/Model name: *//p')" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: cache/artifacts
          key: artifacts-${{ hashFiles('artifacts.lock.json', 'products/modrinth-pins.json') }}
      - name: Build runtime image
        run: docker build -t mc-antivpn-bench:ci harness/docker && echo "BENCH_IMAGE=$(docker image inspect mc-antivpn-bench:ci --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Reuse recorded provider answers
        if: inputs.state_from_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/work/state" "$RUNNER_TEMP/sealed"
          gh run download "${{ inputs.state_from_run }}" -n interposer-state -D "$RUNNER_TEMP/sealed"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:ARTIFACT_KEY -in "$RUNNER_TEMP/sealed/interposer-state.tgz.enc" \
            | tar xzf - -C "$RUNNER_TEMP/work/state"
      - name: Materialize dataset (RIPE Atlas archive)
        run: |
          docker run --rm -v "$PWD:/bench" -e PYTHONPATH=/bench/harness --entrypoint python3 mc-antivpn-bench:ci \
            -m bench.dataset materialize
      - name: Run
        env:
          PROXYCHECK_KEY: ${{ secrets.PROXYCHECK_KEY }}
          VPNAPI_KEY: ${{ secrets.VPNAPI_KEY }}
          # providers family: optional free keys (set by the owner); a service without its key is skipped.
          PROVIDER_KEY_IPAPI_IS: ${{ secrets.PROVIDER_KEY_IPAPI_IS }}
          PROVIDER_KEY_IPLOCATE: ${{ secrets.PROVIDER_KEY_IPLOCATE }}
          PROVIDER_KEY_IP2LOCATION: ${{ secrets.PROVIDER_KEY_IP2LOCATION }}
          PROVIDER_KEY_IPHUB: ${{ secrets.PROVIDER_KEY_IPHUB }}
          BENCH_PROVIDER_SERVICES: ${{ inputs.services }}
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          [ "${{ steps.nightly.outputs.skip }}" = "true" ] && exit 0
          args="run ${{ steps.nightly.outputs.family }} --run-id $RUN_ID"
          [ -n "${{ inputs.products }}" ] && args="$args --products ${{ inputs.products }}"
          [ -n "${{ inputs.platforms }}" ] && args="$args --platforms ${{ inputs.platforms }}"
          docker run --rm --cap-add NET_ADMIN -v "$PWD:/bench" -v "$RUNNER_TEMP/work:/work" \
            -e PYTHONPATH=/bench/harness -e PROXYCHECK_KEY -e VPNAPI_KEY -e PROVIDER_KEY_IPAPI_IS -e PROVIDER_KEY_IPLOCATE \
            -e PROVIDER_KEY_IP2LOCATION -e PROVIDER_KEY_IPHUB -e BENCH_PROVIDER_SERVICES -e GITHUB_SHA -e BENCH_IMAGE -e BENCH_HOST_DESCRIPTION \
            -e BENCH_DETECTION_LIMIT="${{ inputs.detection_limit }}" -e BENCH_PERF_PROFILES="${{ inputs.perf_profiles }}" -e BENCH_PERF_ROUNDS="${{ inputs.perf_rounds || '3' }}" -e BENCH_DETECTION_PROFILES="${{ steps.nightly.outputs.profiles }}" -e BENCH_DETECTION_CHUNK="${{ steps.nightly.outputs.chunk }}" \
            --entrypoint python3 mc-antivpn-bench:ci -m bench $args
      - name: Overview graphic of this run
        if: always() && steps.nightly.outputs.skip != 'true'
        run: |
          [ -d "results/$RUN_ID" ] || exit 0
          sudo chown -R "$(id -u)" "results/$RUN_ID"
          PYTHONPATH=harness python3 -m bench.overview "results/$RUN_ID" --output "results/$RUN_ID" || echo "::warning::overview not drawn"
      # This repository is public, and anyone signed in to GitHub can download a public repository's artifacts.
      # Everything that can hold a volunteer's address (unmasked results, egress logs, recorded answers) is
      # encrypted with ARTIFACT_KEY before upload; without the secret it is not uploaded at all. Decrypting:
      # docs/KEYS.md.
      - name: Seal private artifacts
        if: always()
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          if [ -z "$ARTIFACT_KEY" ]; then echo "::warning::ARTIFACT_KEY is not set: private artifacts are not uploaded"; exit 0; fi
          mkdir -p sealed
          seal() { sudo tar czf - -C "$1" . | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:ARTIFACT_KEY -out "sealed/$2.tgz.enc"; }
          sudo mkdir -p state-pick logs-pick
          sudo cp "$RUNNER_TEMP/work/state/answers.sqlite" state-pick/ 2>/dev/null || true
          sudo sh -c "cp $RUNNER_TEMP/work/state/*.jsonl $RUNNER_TEMP/work/state/interposer.log logs-pick/ 2>/dev/null" || true
          seal state-pick interposer-state
          seal logs-pick interposer-logs
          [ -d "cache/private/runs/$RUN_ID" ] && seal "cache/private/runs/$RUN_ID" results-private || true
          ls -la sealed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-public
          path: results/${{ env.RUN_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interposer-logs
          path: sealed/interposer-logs.tgz.enc
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-private
          path: sealed/results-private.tgz.enc
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interposer-state
          path: sealed/interposer-state.tgz.enc
          if-no-files-found: ignore
          retention-days: 30
