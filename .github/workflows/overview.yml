name: overview

# Redraws docs/overview/ (the graphic at the top of the README) from the newest complete result of every family
# after each benchmark run, and commits it when it changed. Reads only the public `results-public` artifacts.
on:
  workflow_run:
    workflows: [benchmark]
    types: [completed]
  # The nightly runs are dispatched with the GITHUB_TOKEN, and GitHub starts no workflow_run for runs that token
  # created: from 14 Oct 2026 the graphic only moved when someone dispatched a run by hand. The dataset build starts
  # around 04:30 UTC (scheduled 00:05, GitHub delays it) and its last benchmark run ends before 08:00.
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: overview
  cancel-in-progress: false

jobs:
  overview:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && contains(fromJSON('["workflow_dispatch","schedule"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Draw
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}  # bench.freshness reads proxifly's list history
        run: PYTHONPATH=harness python -m bench.latest --repo "$GITHUB_REPOSITORY" --output docs/overview
      - name: Commit when changed
        run: |
          git add docs/overview datasets/freshness
          if git diff --cached --quiet; then echo "overview unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Overview from runs $(python -c 'import json; print(", ".join(sorted({r for v in json.load(open("docs/overview/latest.json"))["runs"].values() for r in v})))')"
          git push
